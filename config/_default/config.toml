baseurl = "/"
canonifyURLs = false
defaultContentLanguage = 'zh-cn'
disableAliases = true
disableHugoGeneratorInject = true
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
languageCode = "zh-cn"
paginate = 7
refLinksErrorLevel = 'WARNING'
rssLimit = 10

# 贡献者 API（api.xuann.wang）域名已失效，resources.GetRemote 拉取失败属预期；
# 不忽略会导致 hugo 以 "logged N error(s)" 退出、阻断 Pages 构建。
# 必须放在文件根部 TOML 裸键区（[section]/[[array]] 之前），否则会被解析进上一个表。
# 0.124+ 官方键名为 ignoreLogs（旧名 ignoreErrors 仅为兼容别名，development/netlify-preview 沿用旧名）。
# Hugo 0.92.1 不支持该配置，必须配合 package.json otherDependencies.hugo 升级版本使用。
ignoreLogs = ["error-remote-getjson"]
# defaultContentLanguageInSubdir = true

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS", "SITEMAP"]

# add output format for section sitemap.xml
[outputFormats.SITEMAP]
mediaType = "application/xml"
baseName = "sitemap"
isHTML = false
isPlainText = true
noUgly = true
rel  = "sitemap"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      linkify = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = false
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "dracula"
    tabWidth = 4

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# [taxonomies]
  # contributor = "contributors"

[permalinks]


[minify.tdewolff.html]
  keepWhitespace = false

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"
    max = ""
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "node_modules/flexsearch"
    target = "assets/js/vendor/flexsearch"
  [[module.mounts]]
    source = "node_modules/katex"
    target = "assets/js/vendor/katex"
  [[module.mounts]]
    source = "node_modules/mermaid"
    target = "assets/js/vendor/mermaid"
